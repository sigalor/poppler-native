name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JOBS: max # node-gyp compiles on every core; prebuildify alone would use one

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2022] # windows-2022: Visual Studio 2022
        node: [22, 24, 26]
        include:
          # windows-2025 has Visual Studio 2026, which npm finds from npm 11 on (it comes with Node 24 and newer)
          - { os: windows-2025, node: 24 }
          - { os: windows-2025, node: 26 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install Ghostscript (for the reconvertThroughPS tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - name: Install (compiles from source)
        run: npm ci --no-audit --no-fund
      - run: npm test

  compilers:
    name: Build with ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      matrix:
        include: # the oldest compilers the README promises (Clang 16 and 17 can't parse GCC 14's C++23 headers)
          - { cc: gcc-12, cxx: g++-12 }
          - { cc: clang-18, cxx: clang++-18 }
    runs-on: ubuntu-24.04
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test

  test-alpine:
    name: Test (Alpine, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install and test in node:24-alpine
        run: >-
          docker run --rm -v "$PWD:/src" -w /src node:24-alpine
          sh -c "apk add --no-cache build-base python3 ghostscript && npm ci --no-audit --no-fund && npm test"

  sanitize:
    name: AddressSanitizer, UBSan and LeakSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: scripts/sanitize.sh

  prebuild:
    name: Prebuild ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-glibc, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, libc: glibc }
          - { target: linux-arm64-glibc, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, libc: glibc }
          - { target: linux-x64-musl, runner: ubuntu-24.04, image: 'node:24-alpine', libc: musl }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, image: 'node:24-alpine', libc: musl }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: win32-x64, runner: windows-2025 }
          - { target: win32-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in ${{ matrix.image }}
        if: matrix.image
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} sh .github/scripts/prebuild-linux.sh ${{ matrix.libc }}
      - uses: actions/setup-node@v7
        if: '!matrix.image'
        with:
          node-version: 24
      - name: Build
        if: '!matrix.image'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prebuildify --napi --strip
      - name: Test the prebuilt binary
        if: '!matrix.image'
        shell: bash
        run: rm -rf build && npm test
      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuilds/
          if-no-files-found: error

  package:
    name: Package
    needs: prebuild
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true
      - name: Pack
        run: |
          find prebuilds -type f -exec ls -l {} +
          test "$(find prebuilds -name '*.node' | wc -l)" -eq 8
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: poppler-native-*.tgz
          if-no-files-found: error

  smoke:
    name: Install on ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Debian 12, Node 22 (no compiler)', runner: ubuntu-24.04, image: 'node:22-bookworm-slim' }
          - { name: 'Debian 13 arm64, Node 26 (no compiler)', runner: ubuntu-24.04-arm, image: 'node:26-trixie-slim' }
          - { name: 'Rocky Linux 8 (glibc 2.28), Node 22', runner: ubuntu-24.04, image: 'rockylinux/rockylinux:8' }
          - { name: 'Alpine 3.20, Node 22 (no compiler)', runner: ubuntu-24.04, image: 'node:22-alpine3.20' }
          - { name: 'Alpine arm64, Node 24 (no compiler)', runner: ubuntu-24.04-arm, image: 'node:24-alpine' }
          - { name: 'macOS arm64', runner: macos-26 }
          - { name: 'macOS x64', runner: macos-15-intel }
          - { name: 'Windows x64', runner: windows-2025 }
          - { name: 'Windows arm64', runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Install and use in ${{ matrix.image }}
        if: matrix.image
        run: docker run --rm -e NODE_MAJOR=22 -v "$PWD:/src" ${{ matrix.image }} sh /src/.github/scripts/smoke.sh /src
      - uses: actions/setup-node@v7
        if: '!matrix.image'
        with:
          node-version: 24
      - name: Install and use
        if: '!matrix.image'
        shell: bash
        run: sh .github/scripts/smoke.sh .
