name: Release

# Pushing a tag v<version> builds and tests everything CI does, then publishes exactly the tarball CI tested to npm and
# creates a GitHub release with the changelog entry. Publishing uses npm's trusted publishing (no token): configure it
# once on npmjs.com, in the package's settings under "Trusted publisher": GitHub Actions, repository
# sigalor/poppler-native, workflow release.yml. npm then adds provenance by itself.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Check the tag, package.json and changelog agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test -f "poppler-native-$version.tgz"
          heading=$(grep -m1 "^# $version " CHANGELOG.md || true)
          test -n "$heading" || { echo "CHANGELOG.md has no entry for $version" >&2; exit 1; }
          case "$heading" in
            *unreleased*) echo "CHANGELOG.md still calls $version unreleased: put the release date in its heading" >&2; exit 1 ;;
          esac
          awk -v v="$version" 'index($0, "# " v " ") == 1 {found=1; next} /^# / && found {exit} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $version" >&2; exit 1; }
      - name: Publish to npm
        run: npm publish "poppler-native-${GITHUB_REF_NAME#v}.tgz" --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "poppler-native-${GITHUB_REF_NAME#v}.tgz" --title "$GITHUB_REF_NAME" --notes-file notes.md
